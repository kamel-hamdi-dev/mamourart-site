name: PHP 8.2 syntax check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP 8.2 syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Verify PHP version
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 2) { exit(1); }'

      - name: Check syntax of all contact PHP files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            contact-submit.php \
            contact-rate-limit.php \
            tests/php/clock-worker.php \
            tests/php/endpoint-worker.php \
            tests/php/fault-functions.php \
            tests/php/guard.php \
            tests/php/interrupt-worker.php \
            tests/php/run.php \
            tests/php/suite.php \
            tests/php/worker.php
          do
            php -l "$file"
          done

      - name: Run contact PHP tests with native mail disabled by the launcher
        shell: bash
        run: php tests/php/run.php
