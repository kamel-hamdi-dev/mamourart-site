name: OVH - Preparer la publication (simulation uniquement)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamourart-ovh-deploy-preparation
  cancel-in-progress: false

jobs:
  simulate:
    name: Inventaire public et tests (aucun deploiement)
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Preparer Node pour les tests JS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dependances des tests
        run: python -m pip install -r requirements.txt

      - name: Tests Python obligatoires
        run: python -m pytest -m "not external" --ignore=tests/test_external_links.py

      - name: Preparer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Verification syntaxe PHP
        run: php -l contact-submit.php

      - name: Construire le plan de publication (sans OVH)
        run: python scripts/ovh_deploy_plan.py --report reports/ovh-deploy-plan.md

      - name: Afficher le rapport GitHub
        run: cat reports/ovh-deploy-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le rapport
        uses: actions/upload-artifact@v4
        with:
          name: ovh-publication-simulation
          path: reports/ovh-deploy-plan.md
          if-no-files-found: error
